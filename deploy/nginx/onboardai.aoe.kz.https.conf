# Production TLS edge for OnboardAI (after certificates exist).
#
# Topology:
#   Internet → HTTPS / this host nginx → 127.0.0.1:3000 (Compose frontend)
#                                     → 127.0.0.1:8081 (bot webhook)
#              Frontend nginx → api:8000 (Docker network only)
#              FastAPI → PostgreSQL / Redis (Docker network only)
#
# Install AFTER certbot has issued a certificate:
#   1. First boot: use onboardai.aoe.kz.conf (HTTP) + certbot --nginx
#   2. Then replace the site with this file:
#        sudo cp deploy/nginx/onboardai.aoe.kz.https.conf \
#          /etc/nginx/sites-available/onboardai.aoe.kz
#        sudo nginx -t && sudo systemctl reload nginx
#
# Do not enable this file before certificates exist — nginx -t will fail.
# Do not publish API:8000 / Postgres / Redis. TRUST_PROXY_HEADERS=true is
# safe only because the API has no host port (docker-compose.prod.yml).
#
# HSTS is enabled here because HTTP already redirects to HTTPS (HTTPS-only).
# Do not add includeSubDomains unless every subdomain of aoe.kz is on HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name onboardai.aoe.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onboardai.aoe.kz;

    ssl_certificate     /etc/letsencrypt/live/onboardai.aoe.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onboardai.aoe.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HTTPS-only edge. includeSubDomains omitted until all subdomains are ready.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Admin UI + /api via Compose frontend (frontend nginx → api:8000).
    # SEC-R1: overwrite client IP — never $proxy_add_x_forwarded_for.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /webhook {
        proxy_pass http://127.0.0.1:8081/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
