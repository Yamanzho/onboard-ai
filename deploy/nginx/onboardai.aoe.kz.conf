# Host Nginx — HTTP-first TLS edge for OnboardAI.
#
# Phase 1 (this file as shipped): HTTP :80 only. Do not add ssl_* until
# Certbot has issued a certificate. Certificate files do not exist yet.
#
# Phase 2 (MANUAL on the VPS, after DNS):
#   sudo certbot --nginx -d onboardai.aoe.kz
# Certbot will add :443, certificate paths, and the HTTP→HTTPS redirect.
#
# Topology (docker-compose.prod.yml):
#   Internet → host nginx (:80 / later :443)
#            → 127.0.0.1:3000  Compose frontend (nginx.prod.conf)
#            → api:8000        Docker network only (no host port)
#            → 127.0.0.1:8081  bot webhook (optional; polling needs no port)
#
# Do NOT proxy /api to 127.0.0.1:8000 — production API has no host port.
# Do NOT use Docker service names (api, frontend) here — host Nginx cannot
# resolve the Compose network.
#
# Install: see docs/deployment/https.md
# Copy:    sudo cp deploy/nginx/onboardai.aoe.kz.conf \
#            /etc/nginx/sites-available/onboardai.aoe.kz

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name onboardai.aoe.kz;

    autoindex off;
    server_tokens off;
    client_max_body_size 10m;

    # Let's Encrypt HTTP-01 (Certbot). Keep before the catch-all proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    # Bot-only authentication stays on the internal Compose network
    # (bot → api:8000) and must not cross the public edge.
    location ^~ /api/v1/auth/bot/ {
        return 404;
    }

    # Prometheus scrapes FastAPI only over the private Docker network.
    location = /metrics {
        return 404;
    }

    # Phase 1: plaintext proxy until Certbot enables HTTPS.
    # After certbot, replace this site with onboardai.aoe.kz.https.conf
    # (HTTP→HTTPS redirect, TLS 1.2/1.3, HSTS, security headers).
    # Do not leave this HTTP listener as the public production edge.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-R1: overwrite — never $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Optional Telegram webhook. Polling mode does not need this location.
    location /webhook {
        proxy_pass http://127.0.0.1:8081/webhook;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
