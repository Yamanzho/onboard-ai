# Host TLS edge bootstrap for OnboardAI (Sprint 1.1).
#
# Install (after DNS A record points here):
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/onboardai.aoe.kz.conf /etc/nginx/sites-available/onboardai.aoe.kz
#   sudo ln -sf /etc/nginx/sites-available/onboardai.aoe.kz /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d onboardai.aoe.kz
#
# Compose must use docker-compose.prod.yml only (frontend on 127.0.0.1:3000).
# Never stack docker-compose.ip.yml in production.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name onboardai.aoe.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Bootstrap only: plaintext proxy until certbot issues a certificate.
    # After certbot, replace this site with onboardai.aoe.kz.https.conf
    # (HTTP→HTTPS redirect, TLS 1.2/1.3, HSTS, security headers).
    # Do not leave this HTTP listener as the public production edge.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-R1: overwrite — never $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /webhook {
        proxy_pass http://127.0.0.1:8081/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
