global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: onboardai-production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: onboardai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: public-edge
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://onboardai.aoe.kz/health
          - https://onboardai.aoe.kz/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: monitoring
    static_configs:
      - targets:
          - prometheus:9090
          - alertmanager:9093
          - blackbox-exporter:9115
