services:
  migrate:
    build: .
    container_name: onboard-ai-migrate
    env_file:
      - .env
    environment:
      # Schema job only. Keep Settings validation off the production fail-fast
      # path so migrate does not need AI keys or serving secrets.
      APP_ENV: development
      ONBOARD_OWNER_PASSWORD: ${ONBOARD_OWNER_PASSWORD:-onboard}
      ONBOARD_APP_PASSWORD: ${ONBOARD_APP_PASSWORD:-onboard}
      DATABASE_URL: postgresql+asyncpg://onboard_app:${ONBOARD_APP_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://onboard_owner:${ONBOARD_OWNER_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboard}
      POSTGRES_DB: ${POSTGRES_DB:-onboard_ai}
      POSTGRES_HOST: db
    volumes:
      - .:/app
    command: ["/app/docker/entrypoint-migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: onboard-ai-api
    env_file:
      - .env
    environment:
      # Reach Postgres/Redis over the Compose network (overrides localhost from .env)
      # SEC-R3: runtime = onboard_app; migrations = onboard_owner; bootstrap = POSTGRES_USER
      ONBOARD_OWNER_PASSWORD: ${ONBOARD_OWNER_PASSWORD:-onboard}
      ONBOARD_APP_PASSWORD: ${ONBOARD_APP_PASSWORD:-onboard}
      DATABASE_URL: postgresql+asyncpg://onboard_app:${ONBOARD_APP_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://onboard_owner:${ONBOARD_OWNER_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD:-onboard}@db:5432/${POSTGRES_DB:-onboard_ai}
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboard}
      POSTGRES_DB: ${POSTGRES_DB:-onboard_ai}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO: ${SEED_DEMO:-false}
      # Default false: published API port must not trust spoofable X-Forwarded-For.
      # Production (API internal-only): set true via docker-compose.prod.yml.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ONBOARDAI_RUN_STARTUP_MIGRATIONS: "0"
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-45}
    ports:
      # Local/dev convenience (Swagger, direct curl). Do not publish in production —
      # use docker-compose.prod.yml so clients reach the API only via frontend nginx.
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: ["/app/docker/entrypoint-api.sh"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboard-ai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  bot:
    build: .
    container_name: onboard-ai-bot
    env_file:
      - .env
    environment:
      # Reach the API / Redis over the Compose network
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      # Optional demo/ops metadata. Not used for Telegram identity lookup.
      BOT_COMPANY_ID: ${BOT_COMPANY_ID:-11111111-1111-4111-8111-111111111111}
    ports:
      # Local webhook testing via host nginx → 127.0.0.1 only (not LAN/public).
      # Production compose overrides further; polling needs no published port.
      - "127.0.0.1:${BOT_WEBHOOK_PORT:-8081}:8081"
    volumes:
      - .:/app
    command: ["/app/docker/entrypoint-bot.sh"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -z "$${BOT_TOKEN:-}" ]; then exit 0; fi; python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8081/health\", timeout=2)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  db:
    image: pgvector/pgvector:pg16
    container_name: onboard-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboard}
      POSTGRES_DB: ${POSTGRES_DB:-onboard_ai}
    # Bind to localhost only — never expose DB to the LAN/public by default.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onboard} -d ${POSTGRES_DB:-onboard_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onboard-ai-redis
    # Development-only: no requirepass. Bound to localhost so LAN/public cannot
    # reach Redis. Production (docker-compose.prod.yml): password + no host ports.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
