# Host TLS edge sets X-Forwarded-Proto. This container is reached over
# loopback HTTP, so $scheme here is always http. Pass the outer proto through.
# Prefer the TLS edge proto (host nginx sets X-Forwarded-Proto https).
# Direct container access falls back to $scheme (http on 8080).
# map must live in http context (this file is included from conf.d/).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hardening (TLS/HSTS belong on the edge TLS terminator).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # F-06: restrictive CSP for the Vite/React SPA (same-origin API via /api proxy).
    # script-src has no 'unsafe-inline' / wildcards. style-src allows 'unsafe-inline'
    # only for the few React inline style attributes (e.g. progress width).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health to FastAPI (same-origin for empty VITE_API_BASE_URL).
    # SEC-R1: overwrite X-Forwarded-For with $remote_addr — never
    # $proxy_add_x_forwarded_for, which would preserve a client-spoofed XFF
    # and let the API (TRUST_PROXY_HEADERS=true) rate-limit the wrong IP.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /ready {
        proxy_pass http://api:8000/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # P0-05: do not expose OpenAPI/Swagger/ReDoc at the edge.
    # FastAPI also disables these when APP_ENV=production; nginx returns 404
    # so the SPA fallback cannot serve index.html for these paths.
    location /docs {
        return 404;
    }
    location = /openapi.json {
        return 404;
    }
    location /redoc {
        return 404;
    }
}
