[project]
name = "onboard-ai"
version = "0.1.0"
description = "Telegram-first SaaS for AI-powered onboarding"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "aiohttp>=3.10.0",
    "pgvector>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: fast checks without the HTTP API (core/knowledge helpers)",
    "integration: multi-step flows against live Postgres",
    "security: tenant isolation, RBAC, IDOR, invites, auth, subscriptions, TLS edge",
    "api: HTTP API tests",
    "telegram: Telegram bot identity, cabinet, and service-token tests",
    "infra: compose, nginx, Docker, CI, and operator docs",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/bot/*",
    "app/workers/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
